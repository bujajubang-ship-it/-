services:
  - type: web
    name: youtube-researcher
    env: python
    pythonVersion: 3.12.0
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    branch: main
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRATEGY_BRAIN_PROVIDER
        value: openai
      - key: STRATEGY_BRAIN_FALLBACK_PROVIDER
        value: anthropic
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_REASONING_EFFORT
        value: max
      - key: OPENAI_STORE_RESPONSES
        value: "false"
      - key: YT_AUTO_SYNC_ENABLED
        value: "true"
      - key: YT_AUTO_SYNC_INTERVAL_SECONDS
        value: "21600"
      - key: YT_RETENTION_PER_RUN
        value: "20"
      - key: YT_REPORTING_AUTO_CREATE
        value: "true"
      - key: EDIT_STORAGE_BACKEND
        value: local
      - key: EDIT_DISK_RESERVE_MB
        value: "128"
      - key: EDIT_SOURCE_RETENTION_HOURS
        value: "72"
      - key: EDIT_OUTPUT_RETENTION_HOURS
        value: "720"
      - key: EDIT_CLEANUP_INTERVAL_SECONDS
        value: "3600"
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
